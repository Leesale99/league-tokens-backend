name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # CI artifact directory — captured on failure for AI analysis
      - run: mkdir -p /tmp/ci-artifacts

      # Build & verify
      - name: Build
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee /tmp/ci-artifacts/build.log

      - name: Vet
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee /tmp/ci-artifacts/vet.log

      # Unit tests
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/ci-artifacts/test.log

      # Lint & static analysis
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Vulnerability scan
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"

      # Container build
      - name: Docker build
        run: |
          set -o pipefail
          docker build -t league-tokens-backend . 2>&1 | tee /tmp/ci-artifacts/docker.log

      # Upload logs for CI failure analysis bridge
      - name: Upload CI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: /tmp/ci-artifacts/
          retention-days: 1

