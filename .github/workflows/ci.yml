name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Build & verify
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit tests
      - name: Test
        run: go test ./...

      # Lint & static analysis
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Vulnerability scan
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"

      # Container build
      - name: Docker build
        run: docker build -t league-tokens-backend .

