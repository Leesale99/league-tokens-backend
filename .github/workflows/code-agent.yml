name: Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  code-agent:
    if: |
      github.actor != 'aleksrdvn-code' && (
        contains(github.event.comment.body, ' /code') ||
        startsWith(github.event.comment.body, '/code')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure oc-sdk-go custom provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'MODELS_EOF'
          {
            "providers": {
              "oc-sdk-go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "models": [
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "cost": {"input": 0.14, "output": 0.28, "cacheRead": 0.0028, "cacheWrite": 0},
                    "contextWindow": 1000000,
                    "maxTokens": 384000
                  }
                ]
              }
            }
          }
          MODELS_EOF

      - name: Fetch PR diff
        id: pr-diff
        run: |
          PR="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -n "$PR" ]; then
            echo 'diff<<DIFF_EOF' >> "$GITHUB_OUTPUT"
            gh pr diff "$PR" --repo "${{ github.repository }}" 2>/dev/null | head -n 500 >> "$GITHUB_OUTPUT" || true
            echo 'DIFF_EOF' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Code Agent
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.CODE_BOT_PAT }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          auto_compaction: true
          loaded_tools: |
            create_pull_request_review
            update_pull_request
            get_ci_status
          prompt: |
            You were triggered by a `/code` command on a PR review comment
            thread. REPLY IN THE SAME COMMENT THREAD.
            Your reply must be a single sentence, no reasoning or planning.

            ## PR Diff
            ${{ steps.pr-diff.outputs.diff }}

            ## What to do

            1. Review the PR diff above to understand the suggestion.
            2. Make the changes in the checked-out repo.
            3. Push commits using `update_pull_request`.
            4. Reply with a 1-line summary — no reasoning, no planning.

            ## Rules

            - Your reply = EXACTLY one sentence summarizing what changed.
            - Complete everything in 2 tool-call rounds maximum.
