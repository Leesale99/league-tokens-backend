name: Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  # Serialize /code runs per PR: two comments posted close together would
  # otherwise race on the same checkout and second-guess each other's edits.
  cancel-in-progress: true

jobs:
  code-agent:
    if: |
      !endsWith(github.actor, '[bot]') && (
        contains(github.event.comment.body, ' /code') ||
        startsWith(github.event.comment.body, '/code')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure oc-sdk-go custom provider
        run: bash .github/scripts/configure-provider.sh

      - name: Fetch thread context
        id: thread-context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" | sed 's|^/code[[:space:]]*||')
          echo "task<<TASK_EOF" >> "$GITHUB_OUTPUT"
          echo "$TASK" >> "$GITHUB_OUTPUT"
          echo "TASK_EOF" >> "$GITHUB_OUTPUT"

          # The /code anchor: path + line + diff hunk of the inline comment
          # that triggered this run. This is what "this comment" refers to,
          # even when the /code is a top-level comment (no parent to derive
          # thread context from). Without it the agent has to go hunting.
          COMMENT_PATH=$(jq -r '.comment.path // empty' "$GITHUB_EVENT_PATH")
          COMMENT_LINE=$(jq -r '.comment.line // .comment.original_line // empty' "$GITHUB_EVENT_PATH")
          COMMENT_HUNK=$(jq -r '.comment.diff_hunk // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$COMMENT_PATH" ] && [ -n "$COMMENT_LINE" ]; then
            echo "anchor=$COMMENT_PATH:$COMMENT_LINE" >> "$GITHUB_OUTPUT"
            echo "anchor_hunk<<HUNK_EOF" >> "$GITHUB_OUTPUT"
            echo "$COMMENT_HUNK" | head -c 3000 >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "HUNK_EOF" >> "$GITHUB_OUTPUT"
          fi

          IN_REPLY_TO=$(jq -r '.comment.in_reply_to_id // 0' "$GITHUB_EVENT_PATH")
          echo "in_reply_to=$IN_REPLY_TO" >> "$GITHUB_OUTPUT"
          if [ "$IN_REPLY_TO" != "0" ] && [ "$IN_REPLY_TO" != "null" ]; then
            PARENT=$(gh api "repos/${{ github.repository }}/pulls/comments/$IN_REPLY_TO" --jq '.body' 2>/dev/null || true)
            if [ -n "$PARENT" ]; then
              echo "parent_body<<PARENT_EOF" >> "$GITHUB_OUTPUT"
              echo "$PARENT" >> "$GITHUB_OUTPUT"
              echo "PARENT_EOF" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run Code Agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          # GITHUB_TOKEN (not a PAT): the agent's reply comment is posted as
          # github-actions[bot], so it can't spawn a second workflow run.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          # Off: the task is small and single-anchored; explicit reasoning on
          # an ambiguous task caused runaway deliberation and a garbled reply.
          thinking_level: off
          auto_compaction: true
          export_session_jsonl: true
          loaded_tools: |
            read
            write
            edit
            grep
            bash
            update_pull_request
          prompt: |
            You were triggered by a `/code` command.
            REPLY IN THE SAME COMMENT THREAD.

            ## Target anchor (the code this /code refers to)
            `${{ steps.thread-context.outputs.anchor }}`
            ```diff
            ${{ steps.thread-context.outputs.anchor_hunk }}
            ```

            ## Thread Context (the comment being replied to)
            ${{ steps.thread-context.outputs.parent_body }}

            ## Task
            ${{ steps.thread-context.outputs.task }}

            ## What to do

            1. The task concerns ONLY the file and lines in Target anchor. Do NOT explore other files, the PR thread, or repository history.
            2. Make the change with `read`/`write`/`edit`/`grep`. Use `bash` only as a last resort when other tools aren't enough.
            3. Push via `update_pull_request`.
            4. Reply with a 1-line summary.

            ## Hard limit

            STOP after 2 tool rounds. If the task is not complete by then, reply with what you found and what is blocking you — do not keep calling tools.

            ## Reply format (strict)

            Your reply is posted as a comment in the PR thread and read by a human. It must be:

            - ONE sentence. No bullet points, no headings, no code blocks.
            - Result-only: state what you changed (or that no change was needed, in a few words).
            - NEVER narrate your process. Do not start with "Let me...", do not recap what the thread said, do not list what you verified step by step, do not include any reasoning or deliberation.

            Examples:
            - "Fixed — duplicate `Config` block removed from `internal/feed/config.go`."
            - "No change needed — `schedule.Config.Validate()` already rejects an empty `provider_api_key` (covered by an existing test)."

      - name: Aggregate token usage
        if: always()
        run: |
          set -euo pipefail
          # The action reports true session usage via outputs (from
          # pi.getSessionStats()); the exported JSONL lands in a temp dir that
          # the host step can't reliably read, so we don't parse it.
          INPUT_TOKENS="${{ steps.pi.outputs.input_tokens }}"
          OUTPUT_TOKENS="${{ steps.pi.outputs.output_tokens }}"
          COST="${{ steps.pi.outputs.cost }}"
          {
            echo "## Token Usage"
            echo ""
            echo "**Job:** Code Agent · **Model:** deepseek-v4-flash"
            echo ""
            echo "| Input (fresh) | Output | Cost |"
            echo "|---|---|---|"
            echo "| ${INPUT_TOKENS:-0} | ${OUTPUT_TOKENS:-0} | \$${COST:-0} |"
          } >> "$GITHUB_STEP_SUMMARY"
