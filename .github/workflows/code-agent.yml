name: Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  code-agent:
    if: |
      github.actor != 'aleksrdvn-code' && (
        contains(github.event.comment.body, ' /code') ||
        startsWith(github.event.comment.body, '/code')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Seed OpenCode model cache for pi-opencode-bridge
        run: |
          mkdir -p ~/.cache/opencode
          cat > ~/.cache/opencode/models.json << 'MODELS_EOF'
          {
            "opencode-go": {
              "id": "opencode-go",
              "env": ["OPENCODE_API_KEY"],
              "npm": "@ai-sdk/openai-compatible",
              "api": "https://opencode.ai/zen/go/v1",
              "name": "OpenCode Go",
              "models": {
                "deepseek-v4-flash": {
                  "id": "deepseek-v4-flash",
                  "name": "DeepSeek V4 Flash",
                  "family": "deepseek-flash",
                  "reasoning": true,
                  "reasoning_options": [{"type": "effort", "values": ["high", "max"]}],
                  "tool_call": true,
                  "interleaved": {"field": "reasoning_content"},
                  "structured_output": true,
                  "temperature": true,
                  "release_date": "2026-04-24",
                  "last_updated": "2026-04-24",
                  "modalities": {"input": ["text"], "output": ["text"]},
                  "limit": {"context": 1000000, "output": 384000},
                  "cost": {"input": 0.14, "output": 0.28, "cache_read": 0.0028}
                }
              }
            }
          }
          MODELS_EOF

      - name: Run Code Agent
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.CODE_BOT_PAT }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          extensions: |
            npm:pi-opencode-bridge
          loaded_tools: |
            get_pr_diff
            get_issue_or_pr_thread
            create_pull_request_review
            create_pull_request
            update_pull_request
          prompt: |
            When responding to a /code command, reply directly in the
            comment thread where the command was issued — do not create a new
            top-level comment. Before posting, check if a previous bot comment
            in the same thread already addresses this topic and update it instead
            of creating a duplicate. Keep responses concise.
