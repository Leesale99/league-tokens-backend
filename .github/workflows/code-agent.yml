name: Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  code-agent:
    if: |
      !endsWith(github.actor, '[bot]') && (
        contains(github.event.comment.body, ' /code') ||
        startsWith(github.event.comment.body, '/code')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure oc-sdk-go custom provider
        run: bash .github/scripts/configure-provider.sh

      - name: Fetch thread context
        id: thread-context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" | sed 's|^/code[[:space:]]*||')
          echo "task<<TASK_EOF" >> "$GITHUB_OUTPUT"
          echo "$TASK" >> "$GITHUB_OUTPUT"
          echo "TASK_EOF" >> "$GITHUB_OUTPUT"

          IN_REPLY_TO=$(jq -r '.comment.in_reply_to_id // 0' "$GITHUB_EVENT_PATH")
          echo "in_reply_to=$IN_REPLY_TO" >> "$GITHUB_OUTPUT"
          if [ "$IN_REPLY_TO" != "0" ] && [ "$IN_REPLY_TO" != "null" ]; then
            PARENT=$(gh api "repos/${{ github.repository }}/pulls/comments/$IN_REPLY_TO" --jq '.body' 2>/dev/null || true)
            if [ -n "$PARENT" ]; then
              echo "parent_body<<PARENT_EOF" >> "$GITHUB_OUTPUT"
              echo "$PARENT" >> "$GITHUB_OUTPUT"
              echo "PARENT_EOF" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run Code Agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          # GITHUB_TOKEN, not a PAT: events triggered by GITHUB_TOKEN do not
          # create new workflow runs, so the agent's reply comment won't spawn
          # a second (skipped) run after each /code. Requires contents: write
          # on the job to push via update_pull_request.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          # high is the only enabled thinking level for deepseek-v4-flash on
          # oc-sdk-go (low/medium are null in thinkingLevelMap). The /code
          # task — judging whether a review comment is outdated and how it
          # fits the surrounding code — benefits from explicit reasoning, and
          # the scope is small so reasoning tokens are cheap. Reasoning stays
          # internal; the strict Reply format keeps the posted comment clean.
          thinking_level: high
          auto_compaction: true
          export_session_jsonl: true
          loaded_tools: |
            read
            write
            edit
            grep
            bash
            update_pull_request
          prompt: |
            You were triggered by a `/code` command.
            REPLY IN THE SAME COMMENT THREAD.

            ## Thread Context (the comment being replied to)
            ${{ steps.thread-context.outputs.parent_body }}

            ## Task
            ${{ steps.thread-context.outputs.task }}

            ## What to do

            1. Thread Context tells you what needs to change.
            2. Make changes with `read`/`write`/`edit`/`grep`. Use `bash` only as a last resort when other tools aren't enough.
            3. Push via `update_pull_request`.
            4. Reply with a 1-line summary. 2 rounds max.

            ## Reply format (strict)

            Your reply is posted as a comment in the PR thread and read by a human. It must be:

            - ONE sentence. No bullet points, no headings, no code blocks.
            - Result-only: state what you changed (or that no change was needed, in a few words).
            - NEVER narrate your process. Do not start with "Let me...", do not recap what the thread said, do not list what you verified step by step, do not include any reasoning or deliberation.

            Examples:
            - "Fixed — duplicate `Config` block removed from `internal/feed/config.go`."
            - "No change needed — `schedule.Config.Validate()` already rejects an empty `provider_api_key` (covered by an existing test)."

      - name: Aggregate token usage
        if: always()
        env:
          JSONL_PATH: ${{ steps.pi.outputs.session_jsonl_path }}
        run: |
          set -euo pipefail
          USAGE_JSON='{"input":0,"output":0,"cacheRead":0,"cacheWrite":0,"reasoning":0,"total":0,"cost":0}'
          if [ -n "${JSONL_PATH:-}" ] && [ -f "$JSONL_PATH" ]; then
            USAGE_JSON=$(jq -cs '[.[] | (.usage // .message.usage) | select(. != null)] | {input: (map(.input // 0) | add), output: (map(.output // 0) | add), cacheRead: (map(.cacheRead // 0) | add), cacheWrite: (map(.cacheWrite // 0) | add), reasoning: (map(.reasoning // 0) | add), total: (map(.totalTokens // 0) | add), cost: (map(.cost.total // 0) | add)}' "$JSONL_PATH")
          else
            echo "::warning::Session JSONL export unavailable — token usage reported as zero."
          fi
          {
            echo "## Token Usage"
            echo ""
            echo "**Job:** Code Agent · **Model:** deepseek-v4-flash"
            echo ""
            echo "| Input (fresh) | Cache read | Output | Cache write | Reasoning | Total | Cost |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $(echo "$USAGE_JSON" | jq -r '.input') | $(echo "$USAGE_JSON" | jq -r '.cacheRead') | $(echo "$USAGE_JSON" | jq -r '.output') | $(echo "$USAGE_JSON" | jq -r '.cacheWrite') | $(echo "$USAGE_JSON" | jq -r '.reasoning') | $(echo "$USAGE_JSON" | jq -r '.total') | \$$(echo "$USAGE_JSON" | jq -r '.cost * 10000 | round | . / 10000') |"
          } >> "$GITHUB_STEP_SUMMARY"
