name: Code Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  code-agent:
    if: |
      github.actor != 'aleksrdvn-code' && (
        contains(github.event.comment.body, ' /code') ||
        startsWith(github.event.comment.body, '/code')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure oc-sdk-go custom provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'MODELS_EOF'
          {
            "providers": {
              "oc-sdk-go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "models": [
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "cost": {"input": 0.14, "output": 0.28, "cacheRead": 0.0028, "cacheWrite": 0},
                    "contextWindow": 1000000,
                    "maxTokens": 384000
                  }
                ]
              }
            }
          }
          MODELS_EOF

      - name: Run Code Agent
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: ${{ secrets.CODE_BOT_PAT }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          loaded_tools: |
            get_pr_diff
            get_issue_or_pr_thread
            create_pull_request_review
            create_pull_request
            update_pull_request
          prompt: |
            When responding to a /code command, reply directly in the
            comment thread where the command was issued — do not create a new
            top-level comment. Before posting, check if a previous bot comment
            in the same thread already addresses this topic and update it instead
            of creating a duplicate. Keep responses concise.
