name: CI Failure Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  analyze:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read CI failure prompt
        id: prompt
        run: |
          echo 'content<<PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"
          cat .github/prompts/ci-failure.md >> "$GITHUB_OUTPUT"
          echo 'PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"

      - name: Configure oc-sdk-go custom provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'MODELS_EOF'
          {
            "providers": {
              "oc-sdk-go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "models": [
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "cost": {"input": 0.14, "output": 0.28, "cacheRead": 0.0028, "cacheWrite": 0},
                    "contextWindow": 1000000,
                    "maxTokens": 384000
                  }
                ]
              }
            }
          }
          MODELS_EOF

      - name: Run CI failure analysis
        uses: shaftoe/pi-coding-agent-action@v2
        timeout-minutes: 10
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          github_token: ${{ secrets.CODE_BOT_PAT }}
          provider: oc-sdk-go
          model: deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          loaded_tools: |
            get_workflow_run_logs
            get_ci_status
            get_pr_diff
            create_pull_request_review
          prompt: ${{ steps.prompt.outputs.content }}
