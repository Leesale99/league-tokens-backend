# Analyzes CI failures and posts inline remediation suggestions on the PR.
# Triggered when the CI workflow completes on a PR with a failure.

name: CI Failure Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  analyze:
    # Only act on PR CI failures
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download CI failure logs
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ci-artifacts/

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Read CI failure prompt
        id: prompt
        run: |
          echo 'content<<PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"
          cat .github/prompts/ci-failure.md >> "$GITHUB_OUTPUT"
          echo 'PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"

      - name: Run CI failure analysis
        uses: anomalyco/opencode/github@latest
        timeout-minutes: 10
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.content }}
