name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure git identity
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Rebase onto latest remote
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git rev-parse "origin/$BRANCH" >/dev/null 2>&1; then
            git rebase "origin/$BRANCH"
          fi

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          variant: minimal
          use_github_token: true
          prompt: |
            Always reply in the same thread — never create top-level comments.
            You may be triggered on issues as well as pull requests. If you
            successfully committed changes, reply with a few words summarizing
            what was changed. If anything fails, reply with a summary of the
            error and any relevant log output.
