# Slash-command bot: responds to /oc or /opencode on issues and PRs.
# Unlike go-code-review.yml (auto-review), this is interactive — the user
# explicitly asks for help and opencode may create branches + PRs.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One queue per issue/PR to avoid conflicting agent instructions
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pi-agent:
    if: |
      contains(github.event.comment.body, ' /code') ||
      startsWith(github.event.comment.body, '/code')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      # Git identity is required for the opencode handler's auto-commit
      - name: Configure git identity
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.CODE_BOT_PAT }}
          provider: oc-sdk-go
          model: oc-sdk-go/deepseek-v4-flash
          token: ${{ secrets.OPENCODE_GO_API_KEY }}
          trigger: /code
          extensions: |
            npm:pi-opencode-bridge
          loaded_tools: |
            get_pr_diff
            get_issue_or_pr_thread
            create_pull_request_review
            create_pull_request
            update_pull_request
          prompt: |
            When responding to a /oc or /opencode command, reply directly in the
            comment thread where the command was issued — do not create a new
            top-level comment. Before posting, check if a previous bot comment
            in the same thread already addresses this topic and update it instead
            of creating a duplicate. Keep responses concise.
