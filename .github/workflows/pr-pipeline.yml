name: PR Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  has-go:
    if: |
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          if git diff --name-only "origin/$BASE..HEAD" 2>/dev/null | grep -q '\.go$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  verify-requirements:
    if: |
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    outputs:
      no-issue: ${{ steps.verify.outputs.no-issue }}
      issue-num: ${{ steps.verify.outputs.issue-num }}
      checklist: ${{ steps.verify.outputs.checklist }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: .github/scripts/verify-requirements.sh

  # Each review focus runs pi independently and emits its findings as an
  # artifact. Jobs are read-only (no comments); report-and-gate is the single
  # writer that aggregates everything into one consolidated review.
  review:
    name: ${{ matrix.job_name }}
    needs: [has-go]
    if: |
      needs.has-go.outputs.go == 'true' &&
      !endsWith(github.actor, '[bot]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - focus: quality
            model: deepseek-v4-flash
            skills: golang-code-style,golang-naming,golang-documentation
            job_name: Review — Quality
          - focus: correctness
            model: deepseek-v4-flash
            skills: golang-error-handling,golang-safety,golang-concurrency
            job_name: Review — Correctness
          - focus: security
            model: deepseek-v4-flash
            skills: golang-security,golang-dependency-management
            job_name: Review — Security & Dependencies
          - focus: quality-depth
            model: deepseek-v4-flash
            skills: golang-testing,golang-performance,golang-observability,golang-modernize
            job_name: Review — Tests, Performance & Observability
    uses: ./.github/workflows/review.yml
    with:
      focus: ${{ matrix.focus }}
      model: ${{ matrix.model }}
      skills: ${{ matrix.skills }}
      job_name: ${{ matrix.job_name }}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      repo: ${{ github.repository }}
    secrets:
      opencode_api_key: ${{ secrets.OPENCODE_GO_API_KEY }}

  report-and-gate:
    needs: [has-go, ci, verify-requirements, review]
    if: |
      always() &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download review usage artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: review-usage-*
          path: ${{ runner.temp }}/review-usage
      - name: Download review findings artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: review-findings-*
          path: ${{ runner.temp }}/review-findings
      - name: Report & gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HAS_GO: ${{ needs.has-go.outputs.go || 'false' }}
          CHECKLIST: ${{ needs.verify-requirements.outputs.checklist }}
          NO_ISSUE: ${{ needs.verify-requirements.outputs.no-issue }}
          USAGE_DIR: ${{ runner.temp }}/review-usage
          FINDINGS_DIR: ${{ runner.temp }}/review-findings
          HAS_GO_RESULT: ${{ needs.has-go.result }}
          CI_RESULT: ${{ needs.ci.result }}
          VERIFY_RESULT: ${{ needs.verify-requirements.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: .github/scripts/report-and-gate.sh
