name: Merge Gate
on:
  workflow_run:
    workflows: ["Go Code Review (Code Agent)", "CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Run merge gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          TRIGGERING="${{ github.event.workflow_run.name }}"
          TRIGGER_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          REPO="${{ github.repository }}"

          echo "Triggered by: $TRIGGERING ($TRIGGER_CONCLUSION)"

          # ── Find PR ─────────────────────────────────────────────────
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $HEAD_BRANCH — skipping."
            exit 0
          fi
          echo "PR: #$PR_NUMBER | SHA: $HEAD_SHA"

          # ── Check triggering workflow ────────────────────────────────
          if [ "$TRIGGER_CONCLUSION" = "skipped" ]; then
            echo "$TRIGGERING was skipped — gate passed."
            exit 0
          fi
          if [ "$TRIGGER_CONCLUSION" != "success" ]; then
            echo "::error::$TRIGGERING failed ($TRIGGER_CONCLUSION)"
            exit 1
          fi

          # ── Check the other workflow ─────────────────────────────────
          if [ "$TRIGGERING" = "Go Code Review (Code Agent)" ]; then
            OTHER="CI"
          else
            OTHER="Go Code Review (Code Agent)"
          fi

          OTHER_CONCLUSION=$(gh run list --workflow "$OTHER" --branch "$HEAD_BRANCH" \
            --json conclusion,headSha --limit 5 -q \
            '[.[] | select(.headSha == "'"$HEAD_SHA"'") | .conclusion] | first // "missing"' 2>/dev/null || echo "missing")

          if [ "$OTHER_CONCLUSION" = "missing" ]; then
            echo "$OTHER didn't run for this commit — proceeding without it."
          elif [ "$OTHER_CONCLUSION" != "success" ]; then
            echo "::error::$OTHER did not pass ($OTHER_CONCLUSION)"
            exit 1
          fi

          # ── Check labels (two independent axes) ──────────────────────
          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || true)

          # Code review axis: no-review or code-review-passed
          if ! echo "$LABELS" | grep -qE '^no-review$|^code-review-passed$'; then
            echo "::error::Missing no-review or code-review-passed label"
            exit 1
          fi

          # Requirements axis: no-requirements or requirements-verified
          if ! echo "$LABELS" | grep -qE '^no-requirements$|^requirements-verified$'; then
            echo "::error::Missing no-requirements or requirements-verified label"
            exit 1
          fi

          echo "::notice::All merge gates passed."
