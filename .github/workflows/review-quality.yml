name: Review — Quality

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      GH_TOKEN:
        required: true
    inputs:
      PR_NUMBER:
        required: true
        type: string
      REPO:
        required: true
        type: string
      WORKFLOW_RUN_ID:
        required: true
        type: string

jobs:
  quality:
    name: Code Quality Review
    runs-on: ubuntu-latest
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      REPO: ${{ inputs.REPO }}
      WORKFLOW_RUN_ID: ${{ inputs.WORKFLOW_RUN_ID }}
      OPENCODE_PERMISSION: >-
        {"bash": { "*": "deny", "git diff*": "allow", "git log*": "allow", "gh pr diff*": "allow",
        "gh pr view*": "allow", "gh pr comment*": "allow", "gh api*": "allow"}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: |
          for i in 1 2 3; do
            npx skills add https://github.com/samber/cc-skills-golang -a opencode \
              --skill golang-code-style \
              --skill golang-naming \
              --skill golang-documentation \
              -y --copy && break
            sleep 10
          done

      - name: Configure git
        run: |
          git config --global user.email "opencode[bot]@users.noreply.github.com"
          git config --global user.name "opencode[bot]"

      - id: opencode-review
        uses: anomalyco/opencode/github@latest
        timeout-minutes: 13
        with:
          model: opencode-go/deepseek-v4-pro
          use_github_token: true
          prompt: |
            REPO: $REPO
            PR NUMBER: $PR_NUMBER

            You are a senior Go engineer reviewing code quality for this PR.

            ## Task

            1. Read the diff and project context below.
            2. Post ONE GitHub PR Review (event: COMMENT) with all inline comments.
            3. Write a short summary to quality-review-summary.md.

            No commits, no pushes, no standalone comments.

            ## Context

            The PR branch is already checked out.
            @./AGENTS.md
            @./CONTEXT.md
            @/docs/agents/domain.md

            ## Scope

            - **Code style** — idioms, readability, patterns (Skill("golang-code-style"))
            - **Naming** — packages, types, variables, functions (Skill("golang-naming"))
            - **Docs** — exported symbols, package docs (Skill("golang-documentation"))

            Skip formatting that `gofmt` handles.

            ## Rules

            - Flag issues that confuse readers or mislead API consumers — skip nitpicks
            - Skip lines already covered by an existing bot comment
            - Dismiss previous bot comments on code that has since changed

            ## How to write comments

            Structure each comment as:

              🟡 **SUGGESTION** — Short title

              1–2 sentences: the issue, why it matters.

              ```suggestion
              corrected code
              ```

            Use ```suggestion blocks when the fix is a direct code replacement.
            Tone: professional, constructive. Explain the "why", not just the "what".

            ## Efficiency

            - Batch ALL context reads (AGENTS.md, CONTEXT.md, docs/agents/domain.md, PR diff) in ONE batch of tool calls — do not read them one at a time.
            - Do not re-read files you already have. The diff you read first is sufficient.
            - Complete the review in 5 tool-call rounds maximum. If the diff is too large for 5 rounds, skip low-severity findings and post a partial review focusing on the most impactful issues.

      - name: Handle timeout / ensure summary exists
        if: always()
        run: |
          if [ ! -f quality-review-summary.md ]; then
            if [ "${{ steps.opencode-review.outcome }}" = "cancelled" ]; then
              echo "# Quality Review — Time Limit Reached" > quality-review-summary.md
              echo "" >> quality-review-summary.md
              echo "The review exceeded its 13-minute time limit and was unable to complete." >> quality-review-summary.md
              echo "Try re-running the workflow or reviewing the PR diff manually." >> quality-review-summary.md
              echo "::warning::Quality review timed out — placeholder summary created."
            else
              echo "# Quality Review — Failed" > quality-review-summary.md
              echo "" >> quality-review-summary.md
              echo "The review encountered an error and was unable to complete." >> quality-review-summary.md
              echo "Check the workflow logs for details, then try re-running." >> quality-review-summary.md
              echo "::warning::Quality review failed — placeholder summary created."
            fi
          fi

      - name: Upload review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-review-summary
          path: quality-review-summary.md
          if-no-files-found: ignore
          retention-days: 1
