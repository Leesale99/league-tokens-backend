# Orchestrates parallel AI code reviews on PR open/reopen/sync.
# Each matrix entry runs a separate focus (quality, correctness, etc.)
# via the shared review.yml reusable workflow.

name: Go Code Review (OpenCode)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Map each review focus to its model, skills, and prompt file
  review:
    name: ${{ matrix.job_name }}
    # Label event logic:
    #   unlabeled no-review → run (reviews re-enabled)
    #   labeled no-review → skip (reviews disabled)
    #   any other label change → skip (noisy)
    # Non-label events (opened, reopened, synchronize, workflow_dispatch):
    #   run unless no-review label is currently present
    if: |
      !endsWith(github.actor, '[bot]') && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))

        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - focus: quality
            model: opencode-go/deepseek-v4-pro
            skills: golang-code-style,golang-naming,golang-documentation
            job_name: Review — Quality
          - focus: correctness
            model: opencode-go/deepseek-v4-flash
            skills: golang-error-handling,golang-safety,golang-concurrency
            job_name: Review — Correctness
          - focus: security
            model: opencode-go/deepseek-v4-flash
            skills: golang-security,golang-dependency-management
            job_name: Review — Security & Dependencies
          - focus: quality-depth
            model: opencode-go/deepseek-v4-pro
            skills: golang-testing,golang-performance,golang-observability,golang-modernize
            job_name: Review — Tests, Performance & Observability
    uses: ./.github/workflows/review.yml
    with:
      focus: ${{ matrix.focus }}
      model: ${{ matrix.model }}
      skills: ${{ matrix.skills }}
      job_name: ${{ matrix.job_name }}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      repo: ${{ github.repository }}
      workflow_run_id: ${{ github.run_id }}
    secrets:
      opencode_api_key: ${{ secrets.OPENCODE_GO_API_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # Aggregate all review summaries into the PR description
  aggregate-and-report:
    name: Aggregate Reviews & Report
    needs: [review]
    # Same label logic as the review matrix above
    if: |
      always() &&
      !endsWith(github.actor, '[bot]') && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))
        ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download review summaries
        uses: actions/download-artifact@v4
        with:
          path: summaries/
        continue-on-error: true

      - name: Aggregate and update PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: .github/scripts/aggregate-review.sh

      - name: Report final status
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            echo "One or more review jobs failed."
            exit 1
          fi
