name: Go Code Review (OpenCode)

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string


concurrency:
  group: opencode-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Review — Quality
    if: |
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'no-review') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-review')
    uses: ./.github/workflows/review-quality.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  correctness:
    name: Review — Correctness
    if: |
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'no-review') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-review')
    uses: ./.github/workflows/review-correctness.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Review — Security & Dependencies
    if: |
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'no-review') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-review')
    uses: ./.github/workflows/review-security.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-depth:
    name: Review — Tests, Performance & Observability
    if: |
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'no-review') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-review')
    uses: ./.github/workflows/review-quality-depth.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aggregate-and-report:
    name: Aggregate Reviews & Report
    needs: [quality, correctness, security, quality-depth]
    if: |
      always() &&
      !endsWith(github.actor, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'no-review') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download review summaries
        uses: actions/download-artifact@v4
        with:
          path: summaries/
        continue-on-error: true

      - name: Aggregate and update PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          QUALITY_DEPTH_RESULT: ${{ needs['quality-depth'].result }}
        run: .github/scripts/aggregate-review.sh

      - name: Report final status
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            echo "One or more review jobs failed."
            exit 1
          fi
