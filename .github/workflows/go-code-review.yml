name: Go Code Review (Code Agent)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

concurrency:
  group: code-agent-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  has-go:
    if: |
      !endsWith(github.actor, '[bot]') && github.actor != 'aleksrdvn-code' && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))
        ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          if git diff --name-only "origin/$BASE..HEAD" 2>/dev/null | grep -q '\.go$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  dismiss-outdated:
    needs: [has-go]
    if: |
      needs.has-go.outputs.go == 'true' &&
      !endsWith(github.actor, '[bot]') && github.actor != 'aleksrdvn-code' && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))
        ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      existing_comments: ${{ steps.dismiss.outputs.existing_comments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: dismiss
        run: >
          .github/scripts/dismiss-outdated-reviews.sh
          ${{ github.event.pull_request.number || inputs.pr_number }}
          ${{ github.repository }}
          ${{ github.event.pull_request.base.ref || 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review:
    name: ${{ matrix.job_name }}
    needs: [has-go, dismiss-outdated]
    if: |
      needs.has-go.outputs.go == 'true' &&
      !endsWith(github.actor, '[bot]') && github.actor != 'aleksrdvn-code' && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))
        ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - focus: quality
            model: deepseek-v4-pro
            skills: golang-code-style,golang-naming,golang-documentation
            job_name: Review — Quality
          - focus: correctness
            model: deepseek-v4-flash
            skills: golang-error-handling,golang-safety,golang-concurrency
            job_name: Review — Correctness
          - focus: security
            model: deepseek-v4-flash
            skills: golang-security,golang-dependency-management
            job_name: Review — Security & Dependencies
          - focus: quality-depth
            model: deepseek-v4-pro
            skills: golang-testing,golang-performance,golang-observability,golang-modernize
            job_name: Review — Tests, Performance & Observability
    uses: ./.github/workflows/review.yml
    with:
      focus: ${{ matrix.focus }}
      model: ${{ matrix.model }}
      skills: ${{ matrix.skills }}
      job_name: ${{ matrix.job_name }}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      repo: ${{ github.repository }}
      workflow_run_id: ${{ github.run_id }}
      existing_comments: ${{ needs.dismiss-outdated.outputs.existing_comments }}
    secrets:
      opencode_api_key: ${{ secrets.OPENCODE_GO_API_KEY }}

  aggregate-and-report:
    name: Aggregate Reviews & Report
    needs: [has-go, review]
    if: |
      needs.has-go.outputs.go == 'true' &&
      always() &&
      !endsWith(github.actor, '[bot]') && github.actor != 'aleksrdvn-code' && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
         !contains(github.event.pull_request.labels.*.name, 'no-review'))
        ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'no-review')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download review summaries
        uses: actions/download-artifact@v4
        with:
          path: summaries/
        continue-on-error: true

      - name: Aggregate and update PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: .github/scripts/aggregate-review-summaries.sh

      - name: Report final status
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            echo "One or more review jobs failed."
            exit 1
          fi
