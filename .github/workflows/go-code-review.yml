name: Go Code Review (OpenCode)

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Review — Quality
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: ./.github/workflows/review-quality.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  correctness:
    name: Review — Correctness
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: ./.github/workflows/review-correctness.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Review — Security & Dependencies
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: ./.github/workflows/review-security.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-depth:
    name: Review — Tests, Performance & Observability
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: ./.github/workflows/review-quality-depth.yml
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-diagnosis:
    name: Review — Status Dashboard
    needs: [quality, correctness, security, quality-depth]
    if: ${{ always() && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update PR status dashboard
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          NEEDS_DATA: ${{ toJSON(needs) }}
        with:
          script: |
            const updateDashboard = require('./.github/scripts/update-pr-dashboard.js');
            await updateDashboard({ github, context });

      - name: Check for failures
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '\"result\":\"failure\"'; then
            echo "One or more review jobs failed. Check the job logs above."
            exit 1
          fi