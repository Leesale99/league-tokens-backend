name: Review — Security & Dependencies

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: true
      GH_TOKEN:
        required: true
    inputs:
      PR_NUMBER:
        required: true
        type: string
      REPO:
        required: true
        type: string
      WORKFLOW_RUN_ID:
        required: true
        type: string

jobs:
  security:
    name: Security & Dependency Review
    runs-on: ubuntu-latest
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      PR_NUMBER: ${{ inputs.PR_NUMBER }}
      REPO: ${{ inputs.REPO }}
      WORKFLOW_RUN_ID: ${{ inputs.WORKFLOW_RUN_ID }}
      OPENCODE_PERMISSION: >-
        {"bash": { "*": "deny", "git diff*": "allow", "git log*": "allow", "gh pr diff*": "allow",
        "gh pr view*": "allow", "gh pr comment*": "allow", "gh api*": "allow"}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: |
          for i in 1 2 3; do
            npx skills add https://github.com/samber/cc-skills-golang -a opencode \
              --skill golang-security \
              --skill golang-dependency-management \
              -y --copy && break
            sleep 10
          done

      - name: Configure git
        run: |
          git config --global user.email "opencode[bot]@users.noreply.github.com"
          git config --global user.name "opencode[bot]"

      - id: opencode-review
        uses: anomalyco/opencode/github@latest
        timeout-minutes: 13
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            REPO: $REPO
            PR NUMBER: $PR_NUMBER

            You are a senior Go security engineer reviewing security and dependencies for this PR.

            ## Task

            1. Read the diff and project context below.
            2. Post ONE GitHub PR Review (event: COMMENT) with all inline comments.
            3. Write a short summary to /tmp/security-review-summary.md.

            No commits, no pushes, no standalone comments.

            ## Context

            The PR branch is already checked out.
            @./AGENTS.md
            @./CONTEXT.md
            @/docs/agents/domain.md

            ## Scope

            - **Security** — injection, auth, crypto, data exposure, input validation (Skill("golang-security"))
            - **Dependencies** — new imports, CVEs, abandoned packages, `replace` directives (Skill("golang-dependency-management"))

            ## Rules

            - Flag security issues and supply-chain risks before style or quality
            - Skip lines already covered by an existing bot comment
            - Dismiss previous bot comments on code that has since changed

            ## How to write comments

            Structure each comment as:

              [SEVERITY] — Short title

              1–2 sentences: the vulnerability class, attack vector, realistic impact.

              ```suggestion
              corrected code
              ```

            Use ```suggestion blocks when the fix is a direct code replacement.
            Tone: professional, constructive. Explain the "why", not just the "what".

            ## Severity

            - 🔴 **BLOCKING** — exploitable vulnerability or high-risk dependency; must fix before merge
            - 🟠 **IMPORTANT** — significant risk under specific conditions
            - 🟡 **SUGGESTION** — defense-in-depth improvement; optional but worthwhile

            ## Efficiency

            - Batch ALL context reads (AGENTS.md, CONTEXT.md, docs/agents/domain.md, PR diff) in ONE batch of tool calls — do not read them one at a time.
            - Do not re-read files you already have. The diff you read first is sufficient.
            - Complete the review in 5 tool-call rounds maximum. If the diff is too large for 5 rounds, skip low-severity findings and post a partial review focusing on 🔴 BLOCKING and 🟠 IMPORTANT issues only.

      - name: Handle timeout / ensure summary exists
        if: always()
        run: |
          if [ ! -f /tmp/security-review-summary.md ]; then
            if [ "${{ steps.opencode-review.outcome }}" = "cancelled" ]; then
              echo "# Security Review — Time Limit Reached" > /tmp/security-review-summary.md
              echo "" >> /tmp/security-review-summary.md
              echo "The review exceeded its 13-minute time limit and was unable to complete." >> /tmp/security-review-summary.md
              echo "Try re-running the workflow or reviewing the PR diff manually." >> /tmp/security-review-summary.md
              echo "::warning::Security review timed out — placeholder summary created."
            else
              echo "# Security Review — Failed" > /tmp/security-review-summary.md
              echo "" >> /tmp/security-review-summary.md
              echo "The review encountered an error and was unable to complete." >> /tmp/security-review-summary.md
              echo "Check the workflow logs for details, then try re-running." >> /tmp/security-review-summary.md
              echo "::warning::Security review failed — placeholder summary created."
            fi
          fi

      - name: Upload review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-summary
          path: /tmp/security-review-summary.md
          if-no-files-found: ignore
          retention-days: 1
