name: Review

on:
  workflow_call:
    inputs:
      focus:
        required: true
        type: string
      model:
        required: true
        type: string
      skills:
        required: true
        type: string
        description: Comma-separated skill names for this review focus
      job_name:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      repo:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      existing_comments:
        required: false
        type: string
        default: ""
        description: JSON array of {path, line} from dismissed-outdated comments
    secrets:
      opencode_api_key:
        required: true

jobs:
  review:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ inputs.repo }}
      WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
      OUTDATED_COMMENTS: ${{ inputs.existing_comments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore review state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}
          restore-keys: |
            review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-
          fail-on-cache-miss: false

      - name: Compute incremental diff
        id: incremental
        run: .github/scripts/review-state.sh restore ${{ inputs.focus }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Go review skills
        run: |
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            if [ -d "/tmp/cc-skills-golang/skills/$SKILL" ]; then
              cp -r "/tmp/cc-skills-golang/skills/$SKILL" ".pi/skills/"
            else
              echo "::warning::Skill $SKILL not found in cc-skills-golang — skipping"
            fi
          done
          mkdir -p .pi/skills
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            cp -r "/tmp/cc-skills-golang/skills/$SKILL" ".pi/skills/"
          done
          rm -rf /tmp/cc-skills-golang

      - name: Read review prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'content<<PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"
          cat ".github/prompts/_common.md" >> "$GITHUB_OUTPUT"
          cat ".github/prompts/${{ inputs.focus }}.md" >> "$GITHUB_OUTPUT"
          echo '' >> "$GITHUB_OUTPUT"
          echo '## PR Diff' >> "$GITHUB_OUTPUT"
          echo '```diff' >> "$GITHUB_OUTPUT"
          if [ -n "${INCREMENTAL_DIFF:-}" ]; then
            echo "$INCREMENTAL_DIFF" | head -n 500 >> "$GITHUB_OUTPUT"
          else
            gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -n 500 >> "$GITHUB_OUTPUT" || true
          fi
          echo '```' >> "$GITHUB_OUTPUT"
          echo 'PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"

      - name: Configure oc-sdk-go custom provider
        run: bash .github/scripts/configure-provider.sh

      - id: pi
        uses: shaftoe/pi-coding-agent-action@v2
        timeout-minutes: 20
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: oc-sdk-go
          model: ${{ inputs.model }}
          token: ${{ secrets.opencode_api_key }}
          loaded_tools: |
            create_pull_request_review
          auto_compaction: true
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Save review summary
        run: |
          cat <<'REVIEW_SUMMARY_EOF' > "/tmp/${{ inputs.focus }}-review-summary.json"
          ${{ steps.pi.outputs.response }}
          REVIEW_SUMMARY_EOF

      - name: Save review state
        if: success()
        run: .github/scripts/review-state.sh save ${{ inputs.focus }}

      - name: Save review state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-${{ github.run_id }}

      - name: Handle timeout / ensure summary exists
        if: always()
        run: |
          FILE="/tmp/${{ inputs.focus }}-review-summary.json"
          if [ ! -f "$FILE" ]; then
            echo '[]' > "$FILE"
            echo "::warning::Review ${{ inputs.job_name }} did not complete — placeholder summary created."
          fi

      - name: Upload review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.focus }}-summary
          path: /tmp/${{ inputs.focus }}-review-summary.json
          if-no-files-found: ignore
          retention-days: 1
