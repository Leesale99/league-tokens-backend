name: Review

on:
  workflow_call:
    inputs:
      focus:
        required: true
        type: string
      model:
        required: true
        type: string
      skills:
        required: true
        type: string
        description: Comma-separated skill names for this review focus
      job_name:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      repo:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      existing_comments:
        required: false
        type: string
        default: ""
        description: JSON array of {path, line} from dismissed-outdated comments
    secrets:
      opencode_api_key:
        required: true

jobs:
  review:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ inputs.repo }}
      WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
      OUTDATED_COMMENTS: ${{ inputs.existing_comments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore review state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}
          restore-keys: |
            review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-
          fail-on-cache-miss: false

      - name: Compute incremental diff
        id: incremental
        run: .github/scripts/review-state.sh restore ${{ inputs.focus }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Go review skills
        run: |
          git clone --depth 1 https://github.com/samber/cc-skills-golang.git /tmp/cc-skills-golang
          mkdir -p .pi/skills
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            if [ -d "/tmp/cc-skills-golang/skills/$SKILL" ]; then
              cp -r "/tmp/cc-skills-golang/skills/$SKILL" ".pi/skills/"
            else
              echo "::warning::Skill $SKILL not found in cc-skills-golang — skipping"
            fi
          done
          rm -rf /tmp/cc-skills-golang

      - name: Read review prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat ".github/prompts/_common.md" > "$RUNNER_TEMP/review-prompt.md"
          cat ".github/prompts/${{ inputs.focus }}.md" >> "$RUNNER_TEMP/review-prompt.md"
          printf '\n## PR Diff\n' >> "$RUNNER_TEMP/review-prompt.md"
          printf '```diff\n' >> "$RUNNER_TEMP/review-prompt.md"
          if [ -n "${INCREMENTAL_DIFF:-}" ]; then
            echo "$INCREMENTAL_DIFF" | head -n 500 >> "$RUNNER_TEMP/review-prompt.md"
          else
            gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -n 500 >> "$RUNNER_TEMP/review-prompt.md" || true
          fi
          printf '```\n' >> "$RUNNER_TEMP/review-prompt.md"

      - name: Configure oc-sdk-go custom provider
        run: bash .github/scripts/configure-provider.sh

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run pi review
        id: pi
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.opencode_api_key }}
        run: |
          set -euo pipefail
          # Run pi directly (no shaftoe/pi-coding-agent-action): the CLI never
          # posts a final comment on the PR, so no cleanup step is needed.
          # The create_pull_request_review tool comes from our own extension.
          # Load the review skills explicitly (deterministic, no trust/approval
          # dependency on .pi/skills auto-discovery).
          SKILL_ARGS=""
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            if [ -d ".pi/skills/$SKILL" ]; then
              SKILL_ARGS="$SKILL_ARGS --skill .pi/skills/$SKILL"
            else
              echo "::warning::Skill $SKILL not found in .pi/skills — skipping"
            fi
          done

          pi --mode json \
            --provider oc-sdk-go \
            --model "${{ inputs.model }}" \
            --api-key "$OPENCODE_GO_API_KEY" \
            --thinking high \
            -a \
            -e .github/extensions/github-review.ts \
            --tools read,bash,edit,write,grep,find,ls,create_pull_request_review \
            $SKILL_ARGS \
            "@$RUNNER_TEMP/review-prompt.md" \
            > "$RUNNER_TEMP/pi-session.jsonl" 2> "$RUNNER_TEMP/pi-stderr.log"

          # pi exits 0 even when the model call fails (auth/quota/rate limit), so
          # detect a session error in the event stream and fail the job instead.
          if grep -q '"stopReason":"error"' "$RUNNER_TEMP/pi-session.jsonl"; then
            echo "::error::pi session ended with error"
            cat "$RUNNER_TEMP/pi-stderr.log" >&2 || true
            grep '"stopReason":"error"' "$RUNNER_TEMP/pi-session.jsonl" | head -1 >&2 || true
            exit 1
          fi

      - name: Aggregate token usage
        id: usage
        if: always()
        env:
          JSONL_PATH: ${{ runner.temp }}/pi-session.jsonl
          JOB_NAME: ${{ inputs.job_name }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          USAGE_JSON='{"input":0,"output":0,"cacheRead":0,"cacheWrite":0,"reasoning":0,"total":0,"cost":0}'
          if [ -n "${JSONL_PATH:-}" ] && [ -f "$JSONL_PATH" ]; then
            USAGE_JSON=$(jq -cs '[.[] | (.usage // .message.usage) | select(. != null)] | {input: (map(.input // 0) | add), output: (map(.output // 0) | add), cacheRead: (map(.cacheRead // 0) | add), cacheWrite: (map(.cacheWrite // 0) | add), reasoning: (map(.reasoning // 0) | add), total: (map(.totalTokens // 0) | add), cost: (map(.cost.total // 0) | add)}' "$JSONL_PATH")
          else
            echo "::warning::Session JSONL export unavailable — token usage reported as zero."
          fi
          echo "usage=$USAGE_JSON" >> "$GITHUB_OUTPUT"

          # Per-job summary shown on the Actions run page.
          {
            echo "## Token Usage"
            echo ""
            echo "**Job:** ${JOB_NAME} · **Model:** ${MODEL}"
            echo ""
            echo "| Input (fresh) | Cache read | Output | Cache write | Reasoning | Total | Cost |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $(echo "$USAGE_JSON" | jq -r '.input') | $(echo "$USAGE_JSON" | jq -r '.cacheRead') | $(echo "$USAGE_JSON" | jq -r '.output') | $(echo "$USAGE_JSON" | jq -r '.cacheWrite') | $(echo "$USAGE_JSON" | jq -r '.reasoning') | $(echo "$USAGE_JSON" | jq -r '.total') | \$$(echo "$USAGE_JSON" | jq -r '.cost * 10000 | round | . / 10000') |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Machine-readable copy for the PR-body aggregate table.
          jq -n --arg job "$JOB_NAME" --arg model "$MODEL" --argjson usage "$USAGE_JSON" '{job: $job, model: $model, usage: $usage}' > "$RUNNER_TEMP/review-usage.json"

      - name: Upload usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-usage-${{ inputs.focus }}
          path: ${{ runner.temp }}/review-usage.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Save review state
        if: success()
        run: .github/scripts/review-state.sh save ${{ inputs.focus }}

      - name: Save review state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-${{ github.run_id }}
