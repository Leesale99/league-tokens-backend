name: Review

on:
  workflow_call:
    inputs:
      focus:
        required: true
        type: string
      model:
        required: true
        type: string
      skills:
        required: true
        type: string
        description: Comma-separated skill names for this review focus
      job_name:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      repo:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      existing_comments:
        required: false
        type: string
        default: ""
        description: JSON array of {path, line} from dismissed-outdated comments
    secrets:
      opencode_api_key:
        required: true
      gh_token:
        required: true
      code_bot_pat:
        required: true

jobs:
  review:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.gh_token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ inputs.repo }}
      WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
      EXISTING_COMMENTS: ${{ inputs.existing_comments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore review state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}
          restore-keys: |
            review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-
          fail-on-cache-miss: false

      - name: Compute incremental diff
        id: incremental
        run: .github/scripts/review-state.sh restore ${{ inputs.focus }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Go review skills
        run: |
          git clone --depth 1 https://github.com/samber/cc-skills-golang.git /tmp/cc-skills-golang
          mkdir -p .pi/skills
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            cp -r "/tmp/cc-skills-golang/skills/$SKILL" ".pi/skills/"
          done
          rm -rf /tmp/cc-skills-golang

      - name: Read review prompt
        id: prompt
        run: |
          echo 'content<<PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"
          cat ".github/prompts/${{ inputs.focus }}.md" >> "$GITHUB_OUTPUT"
          echo 'PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"

      - name: Configure oc-sdk-go custom provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'MODELS_EOF'
          {
            "providers": {
              "oc-sdk-go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "models": [
                  {
                    "id": "deepseek-v4-pro",
                    "name": "DeepSeek V4 Pro",
                    "reasoning": true,
                    "input": ["text"],
                    "cost": {"input": 0.435, "output": 0.87, "cacheRead": 0.003625, "cacheWrite": 0},
                    "contextWindow": 1000000,
                    "maxTokens": 384000
                  },
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "cost": {"input": 0.14, "output": 0.28, "cacheRead": 0.0028, "cacheWrite": 0},
                    "contextWindow": 1000000,
                    "maxTokens": 384000
                  }
                ]
              }
            }
          }
          MODELS_EOF

      - id: pi
        uses: shaftoe/pi-coding-agent-action@v2
        timeout-minutes: 20
        with:
          github_token: ${{ secrets.code_bot_pat }}
          provider: oc-sdk-go
          model: ${{ inputs.model }}
          token: ${{ secrets.opencode_api_key }}
          loaded_tools: |
            get_pr_diff
            get_issue_or_pr_thread
            create_pull_request_review
          auto_compaction: true
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Save review summary
        run: |
          echo '${{ steps.pi.outputs.response }}' > /tmp/${{ inputs.focus }}-review-summary.md

      - name: Save review state
        if: success()
        run: .github/scripts/review-state.sh save ${{ inputs.focus }}

      - name: Save review state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-${{ github.run_id }}

      - name: Handle timeout / ensure summary exists
        if: always()
        run: |
          FILE="/tmp/${{ inputs.focus }}-review-summary.md"
          if [ ! -f "$FILE" ]; then
            LABEL="${{ inputs.job_name }}"
            if [ "${{ steps.pi.outcome }}" = "cancelled" ] || \
               [ "${{ steps.pi.outcome }}" = "failure" ]; then
              echo "# ${LABEL} — Failed" > "$FILE"
              echo "" >> "$FILE"
              echo "The review did not complete. Check the workflow logs for details." >> "$FILE"
              echo "::warning::${LABEL} did not complete — placeholder summary created."
            else
              echo "# ${LABEL} — Skipped" > "$FILE"
              echo "" >> "$FILE"
              echo "The review was skipped." >> "$FILE"
            fi
          fi

      - name: Upload review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.focus }}-summary
          path: /tmp/${{ inputs.focus }}-review-summary.md
          if-no-files-found: ignore
          retention-days: 1
