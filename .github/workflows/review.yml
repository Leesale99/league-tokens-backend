name: Review

on:
  workflow_call:
    inputs:
      focus:
        required: true
        type: string
      model:
        required: true
        type: string
      skills:
        required: true
        type: string
        description: Comma-separated skill names for this review focus
      job_name:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      repo:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      existing_comments:
        required: false
        type: string
        default: ""
        description: JSON array of {path, line} from dismissed-outdated comments
    secrets:
      opencode_api_key:
        required: true

jobs:
  review:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ inputs.repo }}
      WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
      OUTDATED_COMMENTS: ${{ inputs.existing_comments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore review state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}
          restore-keys: |
            review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-
          fail-on-cache-miss: false

      - name: Compute incremental diff
        id: incremental
        run: .github/scripts/review-state.sh restore ${{ inputs.focus }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Go review skills
        run: |
          git clone --depth 1 https://github.com/samber/cc-skills-golang.git /tmp/cc-skills-golang
          mkdir -p .pi/skills
          for SKILL in $(echo "${{ inputs.skills }}" | tr ',' ' '); do
            if [ -d "/tmp/cc-skills-golang/skills/$SKILL" ]; then
              cp -r "/tmp/cc-skills-golang/skills/$SKILL" ".pi/skills/"
            else
              echo "::warning::Skill $SKILL not found in cc-skills-golang — skipping"
            fi
          done
          rm -rf /tmp/cc-skills-golang

      - name: Read review prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'content<<PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"
          cat ".github/prompts/_common.md" >> "$GITHUB_OUTPUT"
          cat ".github/prompts/${{ inputs.focus }}.md" >> "$GITHUB_OUTPUT"
          echo '' >> "$GITHUB_OUTPUT"
          echo '## PR Diff' >> "$GITHUB_OUTPUT"
          echo '```diff' >> "$GITHUB_OUTPUT"
          if [ -n "${INCREMENTAL_DIFF:-}" ]; then
            echo "$INCREMENTAL_DIFF" | head -n 500 >> "$GITHUB_OUTPUT"
          else
            gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -n 500 >> "$GITHUB_OUTPUT" || true
          fi
          echo '```' >> "$GITHUB_OUTPUT"
          echo 'PROMPT_DELIM_EOF' >> "$GITHUB_OUTPUT"

      - name: Configure oc-sdk-go custom provider
        run: bash .github/scripts/configure-provider.sh

      - id: pi
        uses: shaftoe/pi-coding-agent-action@v2
        timeout-minutes: 20
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: oc-sdk-go
          model: ${{ inputs.model }}
          token: ${{ secrets.opencode_api_key }}
          loaded_tools: |
            create_pull_request_review
          auto_compaction: true
          export_session_jsonl: true
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Aggregate token usage
        id: usage
        if: always()
        env:
          JSONL_PATH: ${{ steps.pi.outputs.session_jsonl_path }}
          JOB_NAME: ${{ inputs.job_name }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          USAGE_JSON='{"input":0,"output":0,"cacheRead":0,"cacheWrite":0,"reasoning":0,"total":0,"cost":0}'
          if [ -n "${JSONL_PATH:-}" ] && [ -f "$JSONL_PATH" ]; then
            USAGE_JSON=$(jq -cs '[.[] | (.usage // .message.usage) | select(. != null)] | {input: (map(.input // 0) | add), output: (map(.output // 0) | add), cacheRead: (map(.cacheRead // 0) | add), cacheWrite: (map(.cacheWrite // 0) | add), reasoning: (map(.reasoning // 0) | add), total: (map(.totalTokens // 0) | add), cost: (map(.cost.total // 0) | add)}' "$JSONL_PATH")
          else
            echo "::warning::Session JSONL export unavailable — token usage reported as zero."
          fi
          echo "usage=$USAGE_JSON" >> "$GITHUB_OUTPUT"

          # Per-job summary shown on the Actions run page.
          {
            echo "## Token Usage"
            echo ""
            echo "**Job:** ${JOB_NAME} · **Model:** ${MODEL}"
            echo ""
            echo "| Input (fresh) | Cache read | Output | Cache write | Reasoning | Total | Cost |"
            echo "|---|---|---|---|---|---|---|"
            echo "| $(echo "$USAGE_JSON" | jq -r '.input') | $(echo "$USAGE_JSON" | jq -r '.cacheRead') | $(echo "$USAGE_JSON" | jq -r '.output') | $(echo "$USAGE_JSON" | jq -r '.cacheWrite') | $(echo "$USAGE_JSON" | jq -r '.reasoning') | $(echo "$USAGE_JSON" | jq -r '.total') | \$$(echo "$USAGE_JSON" | jq -r '.cost * 10000 | round | . / 10000') |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Machine-readable copy for the PR-body aggregate table.
          jq -n --arg job "$JOB_NAME" --arg model "$MODEL" --argjson usage "$USAGE_JSON" '{job: $job, model: $model, usage: $usage}' > "$RUNNER_TEMP/review-usage.json"

      - name: Upload usage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-usage-${{ inputs.focus }}
          path: ${{ runner.temp }}/review-usage.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Save review state
        if: success()
        run: .github/scripts/review-state.sh save ${{ inputs.focus }}

      - name: Save review state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .review-state
          key: review-state-${{ inputs.pr_number }}-${{ inputs.focus }}-${{ github.run_id }}
